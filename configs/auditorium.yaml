# Single frozen policy for the auditorium source, cleaning, feature engineering
# and normal-operation pattern discovery. Keeping these declarations together
# prevents phase-specific files from silently drifting apart.
schema_version: 1
building: auditorium
source_file: auditorium_scientific_data.csv

label_column: labeling
normal_label: Normal condition
binary_fault_label: fault
binary_normal_label: normal

# The canonical measured auditorium signals. All phases consume this one list.
sensor_feature_columns:
  - Set point temperature
  - Return temperature
  - Supply air temperature
  - Supply fan
  - Valve position
  - Heating supply temperature
  - Total heating pump
  - Heating pump 1
  - Heating pump 2
  - Heating pump 3
  - Cooling supply temperature 1
  - Cooling supply temperature 2
  - Total cooling pump
  - Cooling pump 1
  - Cooling pump 2

metadata_columns:
  - AHU name
  - Time
  - labeling
  - building
  - ahu
  - source_row_id
  - timestamp
  - label_raw
  - target_binary

quality_columns:
  - hours_since_previous_observation
  - is_time_gap
  - missing_sensor_count
  - has_missing_sensor
  - is_missing__Set point temperature
  - is_missing__Return temperature
  - is_missing__Supply air temperature
  - is_missing__Supply fan
  - is_missing__Valve position
  - is_missing__Heating supply temperature
  - is_missing__Total heating pump
  - is_missing__Heating pump 1
  - is_missing__Heating pump 2
  - is_missing__Heating pump 3
  - is_missing__Cooling supply temperature 1
  - is_missing__Cooling supply temperature 2
  - is_missing__Total cooling pump
  - is_missing__Cooling pump 1
  - is_missing__Cooling pump 2

# These groups define subsystem availability for Phase 4. They are not fault
# labels and are not automatically promoted to headline predictors.
sensor_groups:
  common:
    - Set point temperature
    - Return temperature
    - Supply air temperature
    - Supply fan
    - Valve position
  heating:
    - Heating supply temperature
    - Total heating pump
    - Heating pump 1
    - Heating pump 2
    - Heating pump 3
  cooling:
    - Cooling supply temperature 1
    - Cooling supply temperature 2
    - Total cooling pump
    - Cooling pump 1
    - Cooling pump 2

feature_variants:
  physical_signal: sensor_feature_columns
  operational_context:
    - sensor_feature_columns
    - missingness_indicators

short_gap_policy:
  maximum_rows: 2
  maximum_hours: 2
  require_observed_value_before_and_after: true
  require_same_ahu: true
  require_active_subsystem: true
  imputation_method: training_fold_median

physical_signal_variant:
  predictor_columns: sensor_feature_columns
  include_missingness_indicators: false
  include_operating_mode: false
  include_sensor_availability: false

operational_context_variant:
  predictor_columns:
    - sensor_feature_columns
    - operating_mode_indicators
    - sensor_availability_indicators
  include_missingness_indicators: true
  include_operating_mode: true
  include_sensor_availability: true

imputation:
  strategy: median
  fit_scope: training_fold_only
  missingness_indicators_headline: false
  missingness_indicators_sensitivity: true

quality_policy:
  duplicate_ahu_timestamp: fail
  invalid_timestamp: fail
  preserve_missing_values: true
  fill_missing_with_zero: false
  forward_fill_across_gaps: false
  timezone: source_local_naive
  placeholders: convert_to_missing_and_flag
  invalid_numeric_values: convert_to_missing_and_flag
  inactive_heating_cooling_values: retain_as_missing
  long_active_gaps: retain_as_missing_and_flag
  excluded_rows: none

# Phase 5 feature-engineering settings.
rolling_windows_rows:
  - 3
  - 24
rate_max_gap_hours: 2

operational_quality_columns:
  - heating_active
  - cooling_active
  - operating_mode_heating
  - operating_mode_cooling
  - operating_mode_mixed
  - operating_mode_unknown
  - missing_sensor_count
  - has_missing_sensor
  - has_structural_missing
  - is_time_gap

operational_sensor_availability: true
operational_missingness_indicators: true

shortcut_audit:
  missing_rate_gap_flag: 0.10
  auc_distance_flag: 0.25

# Pattern discovery settings. PCA filling is visualisation-only and is not a
# training imputation policy.
pca:
  enabled: true
  random_state: 42
  max_rows_per_mode: 20000
