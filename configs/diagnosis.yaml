schema_version: 1
normal_label: Normal condition
model_score_threshold: 0.70
minimum_fault_rows: 30

# Diagnosis is evaluated on fault-labelled rows only. Binary detection remains
# a separate task that decides whether a row is normal or faulty. The original
# dataset fault labels are used directly; no derived group labels are added.

model:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  objective: multi:softprob
  eval_metric: mlogloss
  tree_method: hist
  n_jobs: 2
  random_state: 42

# Physical signals are the headline diagnosis features. Operational context
# can be enabled later as a declared sensitivity comparison.
feature_variants:
  - physical_signal
