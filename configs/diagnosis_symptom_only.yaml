schema_version: 1
normal_label: Normal condition
model_score_threshold: 0.70
minimum_fault_rows: 30

# This is a sensitivity run, not the practical diagnosis headline. It uses
# the same saved feature table and folds while excluding direct actuator,
# equipment-state and pump-status channels.
feature_variants:
  - symptom_only

model:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  objective: multi:softprob
  eval_metric: mlogloss
  tree_method: hist
  n_jobs: 2
  random_state: 42
