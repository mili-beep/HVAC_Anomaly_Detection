[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ahu-fdd"
version = "0.1.0"
description = "Reproducible multibuilding AHU fault detection and diagnosis research pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
audit_multibuilding_ahu = "ahu_fdd.audit:main"
prepare_auditorium_ahu = "ahu_fdd.auditorium:main"
ingest_multibuilding_ahu = "ahu_fdd.multibuilding:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ahu_fdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
