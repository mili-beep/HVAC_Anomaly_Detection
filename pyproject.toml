[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ahu-fdd"
version = "0.1.0"
description = "Reproducible multibuilding AHU fault detection and diagnosis research pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "xgboost>=2.1",
    "tensorflow>=2.20",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
audit_multibuilding_ahu = "ahu_fdd.audit:main"
prepare_auditorium_ahu = "ahu_fdd.auditorium:main"
ingest_multibuilding_ahu = "ahu_fdd.multibuilding:main"
clean_auditorium_ahu = "ahu_fdd.cleaning:main"
engineer_auditorium_features = "ahu_fdd.features:main"
discover_auditorium_patterns = "ahu_fdd.patterns:main"
create_evaluation_splits = "ahu_fdd.splits:main"
create_building_splits = "ahu_fdd.splits:building_main"
create_quality_splits = "ahu_fdd.splits:quality_main"
evaluate_detection_baselines = "ahu_fdd.baselines:main"
run_detection_experiments = "ahu_fdd.detection:main"
run_diagnosis_experiments = "ahu_fdd.diagnosis:main"
run_quality_detection = "ahu_fdd.quality_detection:main"
run_building_detection = "ahu_fdd.building_detection:main"
clean_multibuilding_ahu = "ahu_fdd.quality_cleaning:main"
verify_multibuilding_cleaning = "ahu_fdd.quality_cleaning:verify_main"
engineer_multibuilding_features = "ahu_fdd.multibuilding_features:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ahu_fdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
